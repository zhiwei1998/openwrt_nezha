name: Build NeZha Ipk

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - dev
    paths:
      - '**/*.lua'
      - '**/*.yml'
      - '**/*.config'
      - '**/*.mk'
      - '**/Makefile'

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_CHECKOUT: v24.10.0
  FEEDS_CONF: feeds.conf.default
  UPLOAD_BIN_DIR: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FILE_DATE: $(date +"%Y%m%d_%H%M%S")

jobs:
  build:
    runs-on: ovh
    strategy:
      matrix:
        arch: [x86_64, aarch64_generic, aarch64_cortex-a53]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up environment
      run: |
        df -hT $PWD
        echo "FILE_DATE=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

    - name: Clone OpenWrt source code
      run: |
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout $REPO_CHECKOUT
        make distclean
        # 添加Nezha feed源
        echo 'src-git nezha https://github.com/zhiwei1998/openwrt_nezha' >> feeds.conf.default

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load platform configuration
      run: |
        CONFIG_FILE="configs/${{ matrix.arch }}.config"
        if [ -e "$CONFIG_FILE" ]; then
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig
        else
          echo "Error: Configuration file $CONFIG_FILE not found!" && exit 1
        fi

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download dependencies
      run: |
        cd openwrt
        make download -j$(nproc) V=s

    - name: Build toolchain
      run: |
        cd openwrt
        make -j$(nproc) toolchain/install

    - name: Build NeZha packages
      id: compile
      timeout-minutes: 120
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile for ${{ matrix.arch }}"
        echo "Build start time: $(date)"
        # 合并构建所有需要的包，提高效率
        # 构建并保存输出到临时文件以便调试
        make -j$(nproc) \
          package/feeds/nezha/openwrt-nezha/compile \
          package/feeds/nezha/luci-app-nezha-agent-v1/compile \
          package/feeds/packages/lyaml/compile \
          V=s > build_output.log 2>&1
        
        if [ $? -eq 0 ]; then
          echo "Build completed successfully!"
          echo "::set-output name=status::success"
        else
          echo "Build failed! Showing last 150 lines of output:"
          tail -n 150 build_output.log
          echo "::set-output name=status::failure"
          exit 1
        fi
        echo "Build end time: $(date)"

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ matrix.arch }}_${{ env.FILE_DATE }}
        path: openwrt/bin/packages/${{ matrix.arch }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled() && matrix.arch == 'x86_64' # 只在第一个架构运行
      run: |
        # 获取最新的Nezha Agent版本
        NEZHA_VERSION=$(curl -m 10 -sL "https://api.github.com/repos/nezhahq/agent/releases/latest" | grep "tag_name" | head -n 1 | awk -F ":" '{print $2}' | sed 's/"//g;s/,//g;s/ //g')
        echo "::set-output name=release_tag::${NEZHA_VERSION}-$(date +'%Y%m%d')"
        # Generate release notes
        echo "## NeZha Agent OpenWrt Packages Build" > release.txt
        echo "" >> release.txt
        echo "**Build Date:** $(date +'%Y-%m-%d %H:%M:%S %Z')" >> release.txt
        echo "" >> release.txt
        echo "**Nezha Agent Version:** ${NEZHA_VERSION}" >> release.txt
        echo "" >> release.txt
        echo "**OpenWrt Version:** ${REPO_CHECKOUT}" >> release.txt
        echo "" >> release.txt
        echo "**Supported Architectures:**" >> release.txt
        echo "- x86_64" >> release.txt
        echo "- aarch64_generic" >> release.txt
        echo "- aarch64_cortex-a53" >> release.txt
        echo "" >> release.txt
        echo "**Packages Included:**" >> release.txt
        echo "- nezha-agent" >> release.txt
        echo "- luci-app-nezha-agent-v1" >> release.txt
        echo "- lyaml (dependency)" >> release.txt
        echo "::set-output name=status::success"

    - name: Upload packages to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          openwrt/bin/packages/x86_64/nezha/*
          openwrt/bin/packages/x86_64/packages/lyaml*
          openwrt/bin/packages/aarch64_generic/nezha/*
          openwrt/bin/packages/aarch64_generic/packages/lyaml*
          openwrt/bin/packages/aarch64_cortex-a53/nezha/*
          openwrt/bin/packages/aarch64_cortex-a53/packages/lyaml*
        draft: false
        prerelease: false

    - name: Cleanup
      run: |
        rm -rf openwrt/bin/targets
        rm -rf openwrt/build_dir/target-*
