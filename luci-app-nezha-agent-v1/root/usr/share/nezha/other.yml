# 默认其他配置
# 这些配置项可以在Web界面的"其它设置"中修改

# 禁用发送查询
disable_send_query: false

# GPU监控
gpu: false

# 使用Gitee进行升级
use_gitee_to_upgrade: false

# 使用IPv6国家代码
use_ipv6_country_code: false

# 自动更新周期（秒）
self_update_period: 0

# 硬盘分区白名单（仅通过配置文件修改）
hard_drive_partition_allowlist:
  - /

# 网卡白名单（仅通过配置文件修改）
nic_allowlist:
  wan: true
